name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # Every test runs against the mock server, so CI needs no GPU and no secrets.
      - run: pytest -q -rs

  smoke:
    name: end-to-end smoke (mock server)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Benchmark the mock server from a fresh clone
        run: make bench-smoke
      - name: Check the run was written
        run: |
          run_dir="$(ls -d results/smoke-* | head -n 1)"
          cat "${run_dir}/summary.md"
          test "$(grep -c '^| [0-9]' "${run_dir}/summary.md")" -eq 5
      - name: Render the Kubernetes manifests
        run: kubectl kustomize deploy/vllm > /dev/null
