[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "inferops"
version = "0.1.0"
description = "A mini inference cloud on a single GPU: serve an LLM with vLLM on Kubernetes and measure it honestly."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["llm", "inference", "vllm", "kubernetes", "benchmark", "gpu"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The mock server lets the whole benchmark path run without a GPU (tests, CI, demos).
mock = [
    "starlette>=0.40",
    "uvicorn>=0.30",
]
dev = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
inferops = "inferops.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inferops"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]
